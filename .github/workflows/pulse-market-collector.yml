name: Pulse Market Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read

concurrency:
  group: pulse-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install GMGN CLI
        run: npm install --global gmgn-cli@1.4.9

      - name: Collect Pulse market data
        working-directory: backend/integrations/pulse-market
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PULSE_POLL_INTERVAL_SECONDS: "60"
          PULSE_POLL_WINDOW_MINUTES: "1"
          PULSE_GMGN_CONCURRENCY: "3"
          PULSE_GMGN_TIMEOUT_SECONDS: "30"
          PULSE_WORKER_MAX_RUNTIME_SECONDS: "3300"
        run: python3 run_worker_forever.py

name: Pulse Solana Index

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows can be delayed or occasionally skipped.
    # Two bounded attempts per hour make it much more likely that every UTC
    # hour receives one real observation; the database upsert keeps only one
    # snapshot per hour.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: pulse-solana-index
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect direct Pump.fun chain observations
        working-directory: backend/integrations/pulse-market
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PULSE_SIGNATURE_SAMPLE_BPS: "200"
          # A 2,000-transaction head sample covered only ~33 seconds and
          # routinely contained zero launches or migrations. A fixed 12,000
          # transaction sample remains bounded while making both rare event
          # metrics observable.
          PULSE_MAX_PAGES_PER_RUN: "120"
          PULSE_RPC_PAGE_DELAY_SECONDS: "0.12"
          PULSE_RAW_RETENTION_DAYS: "30"
        run: python3 solana_index_worker.py

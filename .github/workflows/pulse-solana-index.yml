name: Pulse Solana Index

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: pulse-solana-index
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect direct Pump.fun chain observations
        working-directory: backend/integrations/pulse-market
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PULSE_SIGNATURE_SAMPLE_BPS: "200"
          PULSE_MAX_PAGES_PER_RUN: "20"
          PULSE_RAW_RETENTION_DAYS: "30"
        run: python3 solana_index_worker.py

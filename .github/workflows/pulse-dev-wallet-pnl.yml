name: Pulse Dev Wallet PnL

on:
  workflow_dispatch:
    inputs:
      wallet_limit:
        description: "Maximum wallets in this segment"
        required: false
        default: "3"
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: pulse-gmgn-global
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install GMGN CLI
        run: npm install --global gmgn-cli@1.4.9

      - name: Collect rolling 24H Dev wallet PnL
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WALLET_LIMIT: ${{ inputs.wallet_limit || '125' }}
        run: >-
          python3 scripts/collect-dev-wallet-pnl.py
          --limit "$WALLET_LIMIT"
          --timeframes 24h
          --min-interval-seconds 25
          --max-requests-per-minute 2
          --max-cooldown-wait 75
          --max-runtime-seconds 3150

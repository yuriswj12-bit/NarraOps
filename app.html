<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
        <link rel="icon" href="./assets/favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./assets/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180" />
    <title>NarraOps | Narrative Discovery Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css?v=20260805-create-group-fix" />
  </head>
  <body>
    <div class="app-frame">
      <header class="global-header">
        <a class="product-brand" href="./index.html" aria-label="NarraOps home">
          <span class="product-mark-image" aria-hidden="true"></span>
          <span class="product-name">NarraOps</span>
        </a>

        <nav class="primary-nav" aria-label="产品导航">
          <button class="nav-link" type="button" data-view="go">
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span>Go</span>
          </button>
          <button class="nav-link active" type="button" data-view="pulse">
            <i class="fa-solid fa-wave-square" aria-hidden="true"></i>
            <span>Pulse</span>
          </button>
          <button class="nav-link" type="button" data-view="assets">
            <i class="fa-solid fa-wallet" aria-hidden="true"></i>
            <span>Assets</span>
          </button>
        </nav>

        <div class="header-actions">
          <button class="auth-button primary" type="button" data-auth="web3"><i class="fa-solid fa-wallet"></i>连接</button>
          <div class="action-menu-wrap">
            <button class="icon-button" id="notificationButton" type="button" aria-label="通知" aria-expanded="false">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span class="notification-dot" aria-hidden="true"></span>
            </button>
            <div class="floating-menu notification-menu hidden" id="notificationMenu" role="dialog" aria-label="通知">
              <div class="menu-heading" data-i18n="notifications">通知</div>
              <div class="notification-item">
                <span class="notification-icon signal"><i class="fa-solid fa-bolt" aria-hidden="true"></i></span>
                <div>
                  <strong data-i18n="newSignal">新的叙事信号</strong>
                  <p data-i18n="newSignalBody">跨平台讨论速度进入加速区间。</p>
                </div>
              </div>
              <div class="notification-item">
                <span class="notification-icon safe"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></span>
                <div>
                  <strong data-i18n="executionReady">实时执行已接入</strong>
                  <p data-i18n="executionBody">发射和交易会在你的明确确认后提交到链上。</p>
                </div>
              </div>
            </div>
          </div>
          <div class="action-menu-wrap">
            <button class="icon-button" id="languageButton" type="button" aria-label="语言" aria-expanded="false">
              <i class="fa-solid fa-globe" aria-hidden="true"></i>
            </button>
            <div class="floating-menu language-menu hidden" id="languageMenu" role="menu">
              <button type="button" data-language="zh" role="menuitem">简体中文 <i class="fa-solid fa-check" aria-hidden="true"></i></button>
              <button type="button" data-language="en" role="menuitem">English <i class="fa-solid fa-check" aria-hidden="true"></i></button>
            </div>
          </div>
<button class="icon-button" id="accountAssetsButton" type="button" aria-label="账户资产">
            <i class="fa-solid fa-wallet" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="workspace" id="viewRoot" aria-live="polite"></main>
    </div>

    <div class="modal-backdrop hidden" id="modalBackdrop"></div>
    <section class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <span class="section-kicker" id="modalKicker">NarraOps</span>
          <h2 id="modalTitle">Details</h2>
        </div>
        <button class="icon-button" id="closeModalButton" type="button" aria-label="关闭">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
    <script src="./app.js?v=20260811-solana-runtime-compat-fix"></script>
  </body>
</html>
